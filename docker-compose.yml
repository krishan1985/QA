version: '3.9'

services:
  # ── Infrastructure ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sigma_db
      POSTGRES_USER: sigma
      POSTGRES_PASSWORD: password
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigma"]
      interval: 10s; timeout: 5s; retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s; timeout: 5s; retries: 5

  # ── AI Services ────────────────────────────────────
  ai-core:
    build:
      context: ./backend/ai_core
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres, redis]
    volumes: [./reports:/app/reports]

  # ── Optional: Local LLM (FREE, needs 8GB+ RAM) ─────
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    profiles: [local-llm]  # Only start with: docker-compose --profile local-llm up

  # ── Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [ai-core]

volumes:
  postgres_data:
  ollama_data:
